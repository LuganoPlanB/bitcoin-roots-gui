name: Native Windows GUI

on:
  push:
    branches: [main, 'windows/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-integrate:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: gcc:p cmake:p ninja:p python:p pkgconf:p openssl:p libsodium:p mesa:p
      - name: Build, test and stage the Windows executable
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          build="$(cygpath -m "$RUNNER_TEMP")/roots-windows-build"
          stage="$(cygpath -m "$RUNNER_TEMP")/roots-windows-stage"
          cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DROOTS_GUI_BUILD_TESTS=ON
          cmake --build "$build" --target roots-gui roots_gui_windows_input roots_gui_windows_rpc -j 2
          ctest --test-dir "$build" --no-tests=error --output-on-failure
          cmake --install "$build" --prefix "$stage"
          for package in openssl libsodium gcc-libs winpthreads zlib; do
            if [[ -d "/ucrt64/share/licenses/$package" ]]; then
              cp -r "/ucrt64/share/licenses/$package" "$stage/share/doc/roots-gui/licenses/msys2-$package"
            fi
          done
          cp /ucrt64/bin/opengl32.dll "$build/"
          GALLIUM_DRIVER=llvmpipe timeout 30s "$build/roots_gui_windows_input.exe" --owned-desktop
          python -B tests/windows/entry.py "$stage" "$(cygpath -m /ucrt64/bin)"
      - uses: actions/upload-artifact@v4
        with:
          name: roots-gui-windows-x86_64
          path: ${{ runner.temp }}/roots-windows-stage/
          if-no-files-found: error
