name: Standalone GUI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: standalone-gui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-project-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test release automation
        run: node --test tests/release/release.test.cjs
      - name: Lint and exercise standalone project contracts
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/gui-lint-tools"
          "$RUNNER_TEMP/gui-lint-tools/bin/python" -m pip install -r requirements-dev.txt
          "$RUNNER_TEMP/gui-lint-tools/bin/ruff" check .
          python3 -m unittest discover -s tests/project
          python3 tests/support/test_runtime.py

  build-models-and-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ninja-build git pkg-config python3 libssl-dev libsodium-dev libgl1-mesa-dev libx11-dev libxext-dev libxrender-dev libxcb1-dev libglib2.0-dev
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          install: binary
          key: ${{ runner.os }}-${{ runner.arch }}-roots-gui
          max-size: 200M
      - name: Build, run models and verify installation
        env:
          BUILD_DIR: ${{ runner.temp }}/roots-gui-build
          STAGE_DIR: ${{ runner.temp }}/roots-gui-stage
        run: |
          set -Eeuo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DROOTS_GUI_BUILD_TESTS=ON 2>&1 | tee "$RUNNER_TEMP/gui-configure.log"
          cmake --build "$BUILD_DIR" --target roots-gui roots_gui_model_tests -j 2 2>&1 | tee "$RUNNER_TEMP/gui-models.log"
          cmake --install "$BUILD_DIR" --prefix "$STAGE_DIR" 2>&1 | tee "$RUNNER_TEMP/gui-install.log"
          "$STAGE_DIR/bin/roots-gui" --version
          "$STAGE_DIR/bin/roots-gui" --build-contract
          test -f "$STAGE_DIR/bin/roots-gui-assets/fonts/Inter-Regular.ttf"
          test -f "$STAGE_DIR/share/doc/roots-gui/licenses/libwally.txt"
      - name: Retain model results and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-gui-results
          path: |
            ${{ runner.temp }}/gui-configure.log
            ${{ runner.temp }}/gui-models.log
            ${{ runner.temp }}/gui-install.log
            ${{ runner.temp }}/roots-gui-build/tests/runs/
          if-no-files-found: warn

  sdl3-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build and owned display tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config xvfb marco x11-xserver-utils libxtst6 dbus
      - uses: dyne/musl-action@fe1d1871b096824ddb7aa158f68dd63dabdc9586
        id: musl
        with:
          target_arch: x86_64
          version: v2.6.0
          sha256: 67629e48c83942e2ce74cfd79b58eda1c7100d5a6c4bc937e69b450670a45a97
      - name: Build and exercise the static SDL3 executable
        env:
          CC: ${{ steps.musl.outputs.CC }}
          CXX: ${{ steps.musl.outputs.CXX }}
          BUILD_DIR: ${{ runner.temp }}/roots-gui-sdl3
          STAGE_DIR: ${{ runner.temp }}/roots-gui-sdl3-stage
          ROOTS_GUI_MUSL_DEPS: ${{ runner.temp }}/roots-gui-musl/sysroot
        run: |
          set -Eeuo pipefail
          bash .github/scripts/prepare-musl-deps.sh "${ROOTS_GUI_MUSL_DEPS%/sysroot}" 2>&1 | tee "$RUNNER_TEMP/musl-deps.log"
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DROOTS_GUI_SDL3=ON -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/linux-musl-x86_64.cmake" \
            2>&1 | tee "$RUNNER_TEMP/sdl3-configure.log"
          cmake --build "$BUILD_DIR" --target roots-gui -j 2 2>&1 | tee "$RUNNER_TEMP/sdl3-build.log"
          cmake --install "$BUILD_DIR" --prefix "$STAGE_DIR"
          binary="$STAGE_DIR/bin/roots-gui"
          readelf -W -l "$binary" > "$RUNNER_TEMP/sdl3-elf.txt"
          readelf -W -d "$binary" >> "$RUNNER_TEMP/sdl3-elf.txt"
          if grep -Eq 'INTERP|\(NEEDED\)' "$RUNNER_TEMP/sdl3-elf.txt"; then
            echo 'SDL3 executable has dynamic runtime dependencies' >&2
            exit 1
          fi
          "$binary" --build-contract | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["sdl3"] == "3.4.20" and d["backend_symbols_linked"] and not d["native_initialized"], d'
          test -f "$STAGE_DIR/share/doc/roots-gui/licenses/sdl3.txt"
          export TMPDIR="$RUNNER_TEMP"
          python3 -B tests/platform/owned_display.py --output "$RUNNER_TEMP/sdl3-display" -- \
            python3 -B tests/platform/entry_smoke.py --binary "$binary" --check-rendered \
              --output "$RUNNER_TEMP/sdl3-entry"
      - name: Retain static build and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-static-evidence
          path: |
            ${{ runner.temp }}/musl-deps.log
            ${{ runner.temp }}/sdl3-configure.log
            ${{ runner.temp }}/sdl3-build.log
            ${{ runner.temp }}/sdl3-elf.txt
            ${{ runner.temp }}/sdl3-display/
            ${{ runner.temp }}/sdl3-entry/
          if-no-files-found: warn
