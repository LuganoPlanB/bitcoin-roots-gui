name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the calculated release and desktop binaries (false previews only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build_version: ${{ steps.plan.outputs.build_version }}
      ready: ${{ steps.plan.outputs.ready }}
      builds: ${{ steps.base.outputs.builds }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate CI, binary packages, and release base
        id: base
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/release.cjs').prepare({github, context, core});
      - name: Calculate conventional-commit version
        id: semver
        if: steps.base.outputs.base != ''
        uses: ietf-tools/semver-action@46feaa27e7375da0e3d602721e9fb9573598b880 # v1.12.0
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          fromTag: ${{ steps.base.outputs.base }}
          noNewCommitBehavior: current
          noVersionBumpBehavior: current
      - name: Summarize release plan
        id: plan
        uses: actions/github-script@v8
        env:
          RELEASE_BASE: ${{ steps.base.outputs.base }}
          RELEASE_BASE_SHA: ${{ steps.base.outputs.base_sha }}
          RELEASE_NEXT: ${{ steps.semver.outputs.next }}
          RELEASE_BUILDS: ${{ steps.base.outputs.builds }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').finalize({context, core,
              base: process.env.RELEASE_BASE, baseSha: process.env.RELEASE_BASE_SHA,
              next: process.env.RELEASE_NEXT, publish: process.env.RELEASE_PUBLISH === 'true',
              builds: JSON.parse(process.env.RELEASE_BUILDS)});

  linux:
    needs: version
    if: inputs.publish && needs.version.outputs.ready == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ needs.version.outputs.build_version }}

  windows:
    needs: version
    if: inputs.publish && needs.version.outputs.ready == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      release_version: ${{ needs.version.outputs.build_version }}

  macos:
    needs: version
    if: inputs.publish && needs.version.outputs.ready == 'true'
    uses: ./.github/workflows/macos.yml
    with:
      release_version: ${{ needs.version.outputs.build_version }}

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Downloads by ID otherwise add a subdirectory named after the artifact.
      - name: Download the tested Linux Musl package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.linux.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets/linux
      - name: Download the tested Windows package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets/windows
      - name: Download the tested macOS ARM64 package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets/macos
      - name: Publish the tested commit and verified desktop packages
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_BUILDS: ${{ needs.version.outputs.builds }}
          RELEASE_ARTIFACTS: ${{ format('{0},{1},{2}', needs.linux.outputs.artifact_id, needs.windows.outputs.artifact_id, needs.macos.outputs.artifact_id) }}
          RELEASE_ASSET_ROOT: ${{ runner.temp }}/release-assets
        with:
          script: |
            await require('./.github/scripts/release.cjs').publish({github, context, core,
              version: process.env.RELEASE_VERSION, builds: JSON.parse(process.env.RELEASE_BUILDS),
              artifacts: process.env.RELEASE_ARTIFACTS.split(','),
              assetRoot: process.env.RELEASE_ASSET_ROOT});
