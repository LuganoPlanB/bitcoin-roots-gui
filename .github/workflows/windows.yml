name: Native Windows GUI

on:
  push:
    branches: [main, 'windows/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-integrate:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: gcc:p cmake:p ninja:p python:p pkgconf:p openssl:p libsodium:p mesa:p ccache:p
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ${{ runner.temp }}/roots-windows-ccache
          key: roots-windows-ucrt64-${{ github.sha }}
          restore-keys: roots-windows-ucrt64-
      - name: Build and exercise RPC on Windows
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          build="$(cygpath -m "$RUNNER_TEMP")/roots-windows-build"
          export CCACHE_DIR="${build%/*}/roots-windows-ccache"
          export CCACHE_MAXSIZE=200M
          cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DROOTS_GUI_BUILD_TESTS=ON
          cmake --build "$build" --target roots-gui roots_gui_windows_input roots_gui_windows_rpc -j 2
          ctest --test-dir "$build" --no-tests=error --output-on-failure
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/roots-windows-ccache
          key: roots-windows-ucrt64-${{ github.sha }}
      - name: Stage and exercise the Windows desktop package
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          build="$(cygpath -m "$RUNNER_TEMP")/roots-windows-build"
          stage="$(cygpath -m "$RUNNER_TEMP")/roots-windows-stage"
          cmake --install "$build" --prefix "$stage"
          declare -A seen=()
          for dll in "$stage/bin/"*.dll; do
            owner="$(pacman -Qoq "/ucrt64/bin/${dll##*/}")"
            if [[ "${seen[$owner]:-}" ]]; then continue; fi
            seen[$owner]=1
            while IFS= read -r notice; do
              if [[ "$notice" == /ucrt64/share/licenses/* && -f "$notice" ]]; then
                install -Dm644 "$notice" "$stage/share/doc/roots-gui/licenses/msys2-$owner/${notice#/ucrt64/share/licenses/}"
              fi
            done < <(pacman -Qql "$owner")
          done
          cp /ucrt64/bin/opengl32.dll "$build/"
          GALLIUM_DRIVER=llvmpipe timeout 30s "$build/roots_gui_windows_input.exe" --owned-desktop
          python -B tests/windows/entry.py "$stage" "$(cygpath -m /ucrt64/bin)"
          archive="$(cygpath -m "$RUNNER_TEMP")/bitcoin-roots-gui-windows-x86_64"
          python -B -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", sys.argv[2])' "$archive" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: bitcoin-roots-gui-windows-x86_64
          path: ${{ runner.temp }}/bitcoin-roots-gui-windows-x86_64.zip
          overwrite: true
          if-no-files-found: error
